name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests (memory mode)
        run: npm test
      - name: Production build
        env:
          DATABASE_URL: postgresql://verbal:verbal@localhost:5432/verbal_crm?schema=public
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verbal
          POSTGRES_PASSWORD: verbal
          POSTGRES_DB: verbal_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verbal -d verbal_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://verbal_app:verbal@localhost:5432/verbal_crm?schema=public
      DATABASE_URL_ADMIN: postgresql://verbal:verbal@localhost:5432/verbal_crm?schema=public
      REDIS_URL: redis://localhost:6379
      PERSISTENCE_MODE: postgres
      QUEUE_MODE: redis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Create app role and grants
        env:
          PGPASSWORD: verbal
        run: |
          psql -h localhost -U verbal -d verbal_crm -f scripts/grant-app-role.sql
      - name: Migrate and seed (admin)
        run: |
          DATABASE_URL="$DATABASE_URL_ADMIN" npx prisma migrate deploy
          DATABASE_URL="$DATABASE_URL_ADMIN" npx prisma db seed
      - name: Integration tests (app role + RLS)
        run: npm run test:integration
